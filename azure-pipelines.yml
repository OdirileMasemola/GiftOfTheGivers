# Continuous integration for Gift of the Givers (Azure Repos)
# Trigger: pushes to main
# C.2 commit trigger: CI runs automatically on push from Visual Studio / local git
# Stages: Restore → Build → Test
# GiftOfTheGivers.Helpers is restored from the GiftOfTheGivers Azure Artifacts feed (see nuget.config)

trigger:
  - main

pr:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.x'
  webProject: 'GiftOfTheGivers.csproj'
  functionsProject: 'GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj'
  testProject: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'

stages:
  - stage: Restore
    displayName: 'Restore'
    jobs:
      - job: RestoreJob
        displayName: 'Restore NuGet packages'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate Azure Artifacts feed'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore (web)'
            inputs:
              command: 'restore'
              projects: '$(webProject)'
              feedsToUse: 'config'
              nugetConfigPath: 'nuget.config'
              verbosityRestore: 'Normal'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore (functions)'
            inputs:
              command: 'restore'
              projects: '$(functionsProject)'
              feedsToUse: 'config'
              nugetConfigPath: 'nuget.config'
              verbosityRestore: 'Normal'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore (tests)'
            inputs:
              command: 'restore'
              projects: '$(testProject)'
              feedsToUse: 'config'
              nugetConfigPath: 'nuget.config'
              verbosityRestore: 'Normal'

  - stage: Build
    displayName: 'Build'
    dependsOn: Restore
    jobs:
      - job: BuildJob
        displayName: 'Build Release'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate Azure Artifacts feed'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build (web)'
            inputs:
              command: 'build'
              projects: '$(webProject)'
              arguments: '--configuration $(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build (functions)'
            inputs:
              command: 'build'
              projects: '$(functionsProject)'
              arguments: '--configuration $(buildConfiguration)'

  - stage: Test
    displayName: 'Test'
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: 'Run unit tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate Azure Artifacts feed'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration) --logger trx'
              publishTestResults: true
