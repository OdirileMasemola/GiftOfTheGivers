# Continuous integration for Gift of the Givers (Azure Repos)
# Every push and pull request to main runs this pipeline.
#   Build: restores packages (GiftOfTheGivers.Helpers comes from the GiftOfTheGivers
#          Azure Artifacts feed through nuget.config) and compiles the web app and Function.
#   Test:  runs the unit tests and the integration tests in separate steps, then publishes
#          the test results and code coverage to the build summary.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.x'
  nugetConfig: 'nuget.config'
  runSettings: 'coverlet.runsettings'
  webProject: 'GiftOfTheGivers.csproj'
  functionsProject: 'GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj'
  unitTestProject: 'GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj'
  integrationTestProject: 'GiftOfTheGivers.IntegrationTests/GiftOfTheGivers.IntegrationTests.csproj'

stages:
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildJob
        displayName: 'Restore and build'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate to the Azure Artifacts feed'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore (feed from nuget.config)'
            inputs:
              command: 'restore'
              projects: |
                $(webProject)
                $(functionsProject)
              feedsToUse: 'config'
              nugetConfigPath: '$(nugetConfig)'
              verbosityRestore: 'Normal'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build (web app and Function)'
            inputs:
              command: 'build'
              projects: |
                $(webProject)
                $(functionsProject)
              arguments: '--configuration $(buildConfiguration) --no-restore'

  - stage: Test
    displayName: 'Test'
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: 'Unit and integration tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate to the Azure Artifacts feed'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore (test projects)'
            inputs:
              command: 'restore'
              projects: |
                $(unitTestProject)
                $(integrationTestProject)
              feedsToUse: 'config'
              nugetConfigPath: '$(nugetConfig)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build (test projects)'
            inputs:
              command: 'build'
              projects: |
                $(unitTestProject)
                $(integrationTestProject)
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests'
            inputs:
              command: 'test'
              projects: '$(unitTestProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --settings $(runSettings) --collect "XPlat Code Coverage" --logger "console;verbosity=normal"'
              publishTestResults: true
              testRunTitle: 'Unit tests'

          - task: DotNetCoreCLI@2
            displayName: 'Run integration tests'
            condition: succeededOrFailed()
            inputs:
              command: 'test'
              projects: '$(integrationTestProject)'
              arguments: '--configuration $(buildConfiguration) --no-build --settings $(runSettings) --collect "XPlat Code Coverage" --logger "console;verbosity=detailed"'
              publishTestResults: true
              testRunTitle: 'Integration tests'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage (Cobertura)'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
